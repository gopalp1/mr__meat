<h2 mat-dialog-title>{{ data?.branch ? "Edit Outlet" : "Add Outlet" }}</h2>

<div class="search-container theme-color-bg">
  <input
    type="text"
    class="search-input"
    placeholder="Search by name or location"
    [(ngModel)]="searchQuery"
    (input)="onInputChange()"
  />
</div>
<div>
  <div *ngFor="let res of searchResults">
    {{ res?.formatted_address }}
  </div>
</div>
<div class="map-container">
  <agm-map
    [latitude]="lat"
    [longitude]="lng"
    [zoom]="zoom"
    (mapClick)="onMapClick($event)"
  >
    <agm-marker [latitude]="lat" [longitude]="lng"></agm-marker>
  </agm-map>
</div>

<form [formGroup]="outletForm" style="padding: 30px">
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Outlet Name</mat-label>
    <input matInput formControlName="name" />
    <mat-error *ngIf="outletForm.get('name')?.invalid"
      >Name is required</mat-error
    >
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Address</mat-label>
    <textarea matInput formControlName="address"></textarea>
    <mat-error *ngIf="outletForm.get('address')?.invalid"
      >Address is required</mat-error
    >
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Area</mat-label>
    <input matInput formControlName="area" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>City</mat-label>
    <input matInput formControlName="city" />
    <mat-error *ngIf="outletForm.get('city')?.invalid"
      >City is required</mat-error
    >
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Pincode</mat-label>
    <input matInput formControlName="pincode" />
    <mat-error *ngIf="outletForm.get('pincode')?.invalid"
      >Pincode is required</mat-error
    >
  </mat-form-field>

  <div
    style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px"
  >
    <button mat-button (click)="cancel()">Cancel</button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="outletForm.invalid"
      (click)="save()"
    >
      Save
    </button>
  </div>
</form>
