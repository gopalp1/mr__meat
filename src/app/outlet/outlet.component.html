<app-header></app-header>
<div style="min-height: 75vh">
  <div class="dashboard-meta theme-color-bg">
    <div style="font-size: 24px; display: flex; justify-content: space-between">
      <span
        ><button mat-raised-button style="margin-right: 15px" (click)="goBack()">
          <mat-icon style="font-size: 30px !important; height: 28px"
            >chevron_left</mat-icon
          ></button
        >Total outlets</span
      >
      <span *ngIf="!isLoading">{{ totalCount }}</span>
      <div
        *ngIf="isLoading"
        class="skeleton-placeholder"
        style="width: 50px"
      ></div>
    </div>
  </div>

  <div class="search-container theme-color-bg">
    <input
      type="text"
      class="search-input"
      placeholder="Search by name or location"
      [(ngModel)]="searchQuery"
      (input)="onSearchInput($event)"
    />
  </div>

  <div *ngIf="!isLoading; else loadingSkeleton" class="branch-list">
    <div *ngFor="let branch of branches" class="branch-card">
      <div class="branch-card-header">
        <h2 class="branch-title">{{ branch?.name | titlecase }}</h2>
        <div class="branch-icons">
          <button class="icon-btn edit-btn" (click)="add(branch)">✏️</button>
          <button class="icon-btn delete-btn" (click)="confirmDelete(branch)">
            🗑️
          </button>
        </div>
      </div>
      <div class="branch-card-content">
        <div class="branch-address">
          <span class="icon">📍</span>
          <span>
            {{ branch?.address }}
            <span *ngIf="branch?.city">, {{ branch?.city }}</span>
            <span *ngIf="branch?.pincode"> - {{ branch?.pincode }}</span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #loadingSkeleton>
    <div *ngFor="let i of skeletonArray" class="branch-card skeleton">
      <div class="branch-card-header">
        <div
          class="skeleton-placeholder"
          style="width: 90%; height: 24px"
        ></div>
        <div
          class="skeleton-placeholder"
          style="width: 20px; height: 80px"
        ></div>
      </div>
      <div class="branch-card-content">
        <div class="branch-address">
          <div
            class="skeleton-placeholder"
            style="width: 24px; height: 24px"
          ></div>
          <div
            class="skeleton-placeholder"
            style="width: 90%; height: 16px"
          ></div>
        </div>
      </div>
    </div>
  </ng-template>

  <button class="fab-button" (click)="add()">+</button>
</div>
